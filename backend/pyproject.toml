[project]
name = "cybersafe-navigator"
version = "0.1.0"
description = "Cyber Support Navigator: scam and phishing help for elderly and non-technical people"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "temporalio>=1.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "RUF"]
# RUF00x: Hindi text and ₹ are intentional. E501: long data rows (rules, copy) are kept on one line.
ignore = ["RUF001", "RUF002", "RUF003", "E501", "UP047"]
